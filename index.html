<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOHTARF | الدرس السادس – Lesson 6</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#22e58b;--r:#ff4d6d;--y:#e07b00;--b:#2563eb;--c:#eef2ff}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;color:#0b1f5c;font-size:22px;min-height:100vh;background:#fff;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.bub{position:fixed;bottom:-80px;border-radius:50%;background:rgba(37,99,235,.09);animation:up linear infinite;z-index:0}
@keyframes up{to{transform:translateY(-120vh) rotate(360deg)}}
.w{position:relative;z-index:1;max-width:980px;margin:auto;padding:16px}
.logo{display:block;margin:0 auto;width:150px;height:150px;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 40px rgba(255,201,77,.6);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
h1{text-align:center;font-size:2em;font-weight:900;margin:.3em 0}
.card{background:#fff;border:2px solid #c7d2fe;border-radius:24px;padding:20px;margin:18px 0;box-shadow:0 10px 30px rgba(37,99,235,.15)}
.card h2{margin:0 0 10px;color:var(--y);font-size:1.5em}
.ar{font-size:1.35em;font-weight:700;line-height:1.7}
.en{direction:ltr;text-align:left;font-size:1.5em;color:#1d4ed8;line-height:1.6}
.pt{padding:10px 0;border-bottom:1px dashed #c7d2fe}
.pt:last-child{border:0}
button,input{font-family:inherit;font-size:1em}
.btn{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:18px;background:linear-gradient(90deg,#ff9d00,#ff4d6d);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:.15s}
.btn:hover{transform:scale(1.02)}.btn.big{background:linear-gradient(90deg,#22e58b,#4da3ff);font-size:1.2em}
.ov{position:fixed;inset:0;z-index:5;background:#fff;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:none}
.bar{height:14px;border-radius:9px;background:var(--c);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y));transition:.4s}
.q{font-size:1.2em}.o{display:block;width:100%;text-align:start;margin:10px 0;padding:14px;border-radius:16px;border:3px solid #b6c4ff;background:#f5f7ff;color:#0b1f5c;cursor:pointer}
.o:hover{background:#e0e8ff}
.o.ok{background:var(--g);color:#052;border-color:#fff;animation:pop .5s}.o.no{background:var(--r);color:#fff;border-color:#fff;animation:sh .5s}
.o .ar{font-size:1.1em}.o.ok .en{color:#063}.o.no .en{color:#fff}
@keyframes pop{50%{transform:scale(1.07)}}@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.cf{position:fixed;top:-40px;font-size:30px;z-index:9;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.flash{position:fixed;inset:0;z-index:8;pointer-events:none;animation:fo .6s forwards}@keyframes fo{from{opacity:.5}to{opacity:0}}
input{background:#fff;color:#0b1f5c;width:100%;padding:16px;border-radius:16px;border:3px solid var(--y);text-align:center;margin-top:12px}
.sc{font-size:3em;text-align:center;font-weight:900;color:var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin:18px 0}.nb{padding:20px;border:3px solid #c7d2fe;border-radius:24px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;cursor:pointer;font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:.2s}.nb:hover{transform:translateY(-5px) scale(1.03)}.nb .en{color:#fff}.nb i{font-style:normal;font-size:1.6em}
</style></head><body>

const S=[
["١) رقمنة الصور والبكسل والدقة | Image Digitization, Pixel & Resolution",["رقمنة الصور: تحويل الصور العادية (الورقية أو الفوتوغرافية) التي تلتقطها الكاميرات الرقمية أو الماسحات الضوئية إلى صور رقمية يمكن للحاسوب تخزينها ومعالجتها وعرضها.|Image digitization: converting ordinary (paper or photographic) images captured by digital cameras or scanners into digital images the computer can store, process and display.","البكسل (Pixel): أصغر وحدة تكوّن الصورة الرقمية؛ كلما زاد عدد البكسلات زادت دقة الصورة ووضوحها.|Pixel: the smallest unit of a digital image; the more pixels, the higher the resolution and clarity.","أخذ العينات (Sampling): تقسيم الصورة إلى وحدات صغيرة تسمى Pixels واستخراج مستوى السطوع لكل Pixel.|Sampling: dividing the image into small units called pixels and extracting the brightness level of each pixel.","الدقة (Resolution): درجة وضوح الـ Pixels عند أخذ العينات، وحدتها dpi (عدد النقاط في كل بوصة) أو Pixels رأسي × Pixels أفقي مثل 600×800. زيادة الدقة تزيد الوضوح وحجم الملف.|Resolution: the clarity of pixels when sampling, measured in dpi (dots per inch) or vertical × horizontal pixels, e.g. 600×800. Higher resolution = clearer image and bigger file."]],
["٢) التقدير الرقمي والترميز وحجم البيانات | Quantization, Encoding & Data Size",["التقدير الرقمي (Quantization): تحويل سطوع كل Pixel إلى قيم رقمية مقسمة إلى مستويات.|Quantization: converting each pixel’s brightness into numeric values divided into levels.","التدرج (Gradation): قيمة المستوى التي تمثل كثافة اللون؛ يحدد عدد الـ Bits عدد المستويات: 1 bit = 2 ، 2 bits = 4 ، 4 bits = 16 ، 8 bits = 256 مستوى (من 0 إلى 255).|Gradation: the level value representing colour density; bits set the levels: 1 bit = 2, 2 bits = 4, 4 bits = 16, 8 bits = 256 levels (0 to 255).","الترميز (Encoding): التعبير عن القيم الكمية بالأرقام الثنائية (0 و 1). المراحل: المعاينة ← التكميم ← الترميز.|Encoding: expressing the quantized values in binary (0 and 1). Order: Sampling → Quantization → Encoding.","حجم الصورة (bit) = Pixels الرأسي × Pixels الأفقي × عدد Bits. مثال: 600×800×8 = 3,840,000 bit.|Image size (bit) = vertical pixels × horizontal pixels × bits. Example: 600×800×8 = 3,840,000 bit.","مثال 1280×720 بعمق 24 bit: 921,600 × 24 = 22,118,400 bit ÷ 8 = 2,764,800 Byte ≈ 2.76 MB.|Example 1280×720 at 24 bit: 921,600 × 24 = 22,118,400 bit ÷ 8 = 2,764,800 Byte ≈ 2.76 MB."]],
["٣) التنسيق النقطي والمتجهات | Bitmap & Vector Formats",["التنسيق النقطي (Bitmap): يمثل الصور بشبكة من النقاط (pixels)؛ عند التكبير تظهر حواف متعرجة تسمى التعرجات (Jaggies). مناسب للصور الفوتوغرافية، ويُرسم ببرامج مثل Photoshop.|Bitmap: represents images as a grid of pixels; enlarging shows jagged edges called Jaggies. Suited to photos; drawn with programs like Photoshop.","تنسيق المتجهات (Vector): يعتمد على معلومات رياضية (إحداثيات النقاط، زوايا الخطوط، سمك الخطوط)؛ يمكن تكبيره دون فقدان الجودة. مناسب للشعارات والرسوم الهندسية، ويُرسم ببرامج مثل Illustrator.|Vector: based on mathematical information (point coordinates, line angles, line thickness); can be enlarged without losing quality. Suited to logos and geometric drawings; drawn with programs like Illustrator."]],
["٤) تمثيل اللون | Colour Representation",["الألوان الأساسية للضوء: الأحمر والأخضر والأزرق (RGB). أحمر + أخضر = أصفر ، أحمر + أزرق = أرجواني ، أخضر + أزرق = سماوي ، الثلاثة = أبيض.|Primary colours of light: Red, Green, Blue (RGB). R+G = yellow, R+B = magenta, G+B = cyan, all three = white.","الألوان الأساسية للصبغة: السماوي والأرجواني والأصفر (CMY)؛ عند مزجها تقترب الألوان من الأسود.|Primary colours of pigment: Cyan, Magenta, Yellow (CMY); mixing them gets closer to black.","المزج الجمعي (RGB): في التلفزيون وشاشات الكمبيوتر والهواتف، ويقترب من الأبيض. المزج الطرحي (CMY): في الطابعات الملونة، ويقترب من الأسود.|Additive mixing (RGB): TVs, monitors and phones; approaches white. Subtractive mixing (CMY): colour printers; approaches black.","الألوان الكاملة 24-bit: لكل لون 8 bits، أي 3 × 8 = 24 bit، وكل لون يمثل 256 مستوى (0 إلى 255) = 16,777,216 لوناً.|24-bit full colour: 8 bits per colour, 3 × 8 = 24 bit; each colour has 256 levels (0 to 255) = 16,777,216 colours."]]];
S[0][1].push("كيف تتم رقمنة الصور؟ ① تُدخل الصورة إلى الحاسوب بالماسح الضوئي (Scanner) أو الكاميرا الرقمية ② تُقسم إلى عدد كبير من النقاط الصغيرة (Pixels) ③ يُعطى كل بكسل قيمة رقمية تمثل لونه أو درجة سطوعه ④ تُخزن القيم داخل الحاسب على هيئة بيانات رقمية.|How is an image digitized? ① The image is entered using a scanner or digital camera ② It is divided into many small dots (pixels) ③ Each pixel gets a numeric value for its colour or brightness ④ The values are stored in the computer as digital data.","تُقاس الدقة عادةً بالصيغة: العرض × الارتفاع. مثال: صورة بدقة 1920 × 1080 تحتوي على 2,073,600 بكسل. أمثلة على الدقة: 600 × 800 Pixel ، 1080 × 1920 Pixel ، dpi 1200.|Resolution is usually written as width × height. Example: a 1920 × 1080 image contains 2,073,600 pixels. Examples: 600 × 800 pixel, 1080 × 1920 pixel, 1200 dpi.","ملاحظات مهمة: كلما زادت الدقة زاد وضوح الصورة ⇐ وزيادة الدقة تؤدي إلى زيادة حجم ملف الصورة.|Important notes: the higher the resolution, the clearer the image ⇒ and higher resolution increases the image file size.","أهمية رقمنة الصور: لسهولة التخزين والتعديل والمعالجة والمشاركة عبر الإنترنت والمحافظة على الصور القديمة من التلف.|Importance of digitization: easy storage, editing, processing and sharing over the internet, and protecting old images from damage.");
S[1][1].push("جدول التدرج: 1 Bit = 2 مستوى ، 2 Bits = 4 مستويات ، 4 Bits = 16 مستوى ، 8 Bits = 256 مستوى. عند استخدام 8 Bits لكل Pixel: عدد المستويات = 2⁸ = 256 والقيم من 0 إلى 255.|Gradation table: 1 bit = 2 levels, 2 bits = 4 levels, 4 bits = 16 levels, 8 bits = 256 levels. With 8 bits per pixel: levels = 2⁸ = 256, values from 0 to 255.","ملاحظات مهمة: التقدير الرقمي يحول قيم السطوع إلى أرقام يمكن للحاسوب التعامل معها ، التدرج يعبر عن كثافة اللون أو درجة سطوع البكسل ، ويزداد عدد مستويات التدرج بزيادة عدد الـ Bits المخصصة للبكسل.|Important notes: quantization turns brightness values into numbers the computer can handle; gradation expresses colour density or pixel brightness; the levels increase as the bits per pixel increase.","مثال على الترميز: القيمة 7 ← 111 ، 6 ← 110 ، 5 ← 101 ، 4 ← 100 ، 3 ← 011 ، 2 ← 010 ، 1 ← 001.|Encoding example: 7 → 111, 6 → 110, 5 → 101, 4 → 100, 3 → 011, 2 → 010, 1 → 001.","مثال 2: صورة 1080 × 1920 Pixel وعمق اللون 24 Bits: 24 × 2,073,600 = 49,766,400 bit.|Example 2: a 1080 × 1920 image with 24-bit depth: 24 × 2,073,600 = 49,766,400 bit.","العلاقة بين الدقة والتدرج وحجم البيانات: كلما زادت الدقة زاد عدد الـ Pixels ، وكلما زاد التدرج زاد عدد الـ Bits لكل Pixel ، وزيادتهما تجعل الصورة أوضح وأكثر سلاسة لكن تزيد حجم البيانات. تذكر: حجم الصورة يعتمد على [1] عدد البكسلات [2] عدد الـ Bits لكل Pixel.|Relation between resolution, gradation and data size: more resolution = more pixels; more gradation = more bits per pixel; both make the image clearer and smoother but increase data size. Remember: size depends on [1] the number of pixels [2] the bits per pixel.");
S[2][1].push("خصائص التنسيق النقطي: عند تكبير الصورة تفقد جزءاً من جودتها ، ومناسب للصور الفوتوغرافية والصور ذات التفاصيل الكثيرة. خصائص تنسيق المتجهات: يمكن تكبير الصورة أو تصغيرها دون فقدان الجودة ولا تظهر بها التعرجات ، ومناسب للشعارات والرسوم الهندسية والتوضيحية.|Bitmap properties: loses some quality when enlarged; suited to photos and highly detailed images. Vector properties: can be enlarged or reduced without losing quality and without jaggies; suited to logos and geometric/illustrative drawings.","تذكر: التنسيق النقطي = Pixels ، التعرجات (Jaggies) تظهر عند تكبير الصور النقطية فقط ، تنسيق المتجهات = نقاط وخطوط ومعادلات رياضية ، الصور المتجهة تحافظ على جودتها مهما تم تكبيرها أو تصغيرها.|Remember: Bitmap = pixels; jaggies appear only when enlarging bitmap images; vector = points, lines and mathematical equations; vector images keep their quality however much they are enlarged or reduced.","مقارنة (نقطي / متجهات): طريقة التمثيل: شبكة من البكسلات / نقاط وخطوط ومعادلات رياضية ، التكبير: تظهر التعرجات / لا تتأثر الجودة ، الاستخدام: الصور الفوتوغرافية / الشعارات والرسوم الهندسية ، نوع البرنامج: برامج التلوين / برامج الرسم ، مثال: Photoshop / Illustrator.|Comparison (Bitmap / Vector): representation: grid of pixels / points, lines and equations; enlarging: jaggies appear / quality unaffected; use: photographs / logos and geometric drawings; program type: painting programs / drawing programs; example: Photoshop / Illustrator.");
S[3][1].push("الفكرة الأساسية: في المزج الجمعي إضافة الضوء ⇐ الاقتراب من الأبيض (كلما زادت كمية الضوء زاد السطوع). في المزج الطرحي إضافة الصبغات ⇐ الاقتراب من الأسود، إذ يقل انعكاس الضوء فتغمق الألوان.|Basic idea: in additive mixing, adding light ⇒ approaching white (more light = more brightness). In subtractive mixing, adding pigments ⇒ approaching black, as less light is reflected and colours get darker.");
